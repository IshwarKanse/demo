    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      resource_detection:
        detectors: [openshift]
        override: false
        timeout: 5s
    exporters:
      otlp_http:
        # the third-party backend; here the vendor stand-in Prometheus with the OTLP receiver (or the nop sink)
        endpoint: http://vendor-prometheus.otel-platform-metrics.svc.cluster.local:9090/api/v1/otlp
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0
        # the queue must hold the largest single scrape: the cAdvisor endpoint of a node with 300 pods or the
        # kube-apiserver exceed 50,000 data points, and a request larger than the queue is rejected outright
        # ("element size too large")
        sending_queue:
          enabled: true
          sizer: items
          queue_size: 200000
          block_on_overflow: true
          batch:
            flush_timeout: 5s
            min_size: 2000
            max_size: 8000
    service:
      extensions: [k8s_leader_elector]
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
      pipelines:
        metrics:
          receivers: [k8s_cluster, prometheus]
          processors: [memory_limiter, resource_detection]
          exporters: [otlp_http]
# Platform endpoints that the monitoring stack scrapes but that a service account token cannot reach:
#   openshift-apiserver/check-endpoints (check-endpoints): serving certificate valid for localhost only; the monitoring stack uses insecureSkipVerify
