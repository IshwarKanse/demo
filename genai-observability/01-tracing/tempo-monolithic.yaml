# Single-pod Tempo with a persistent volume. Jaeger UI route is enabled for the trace waterfall.
apiVersion: tempo.grafana.com/v1alpha1
kind: TempoMonolithic
metadata:
  name: genai
  namespace: genai-demo
spec:
  storage:
    traces:
      backend: pv
      size: 10Gi
  jaegerui:
    enabled: true
    route:
      enabled: true
