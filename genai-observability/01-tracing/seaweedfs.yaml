# Object storage for Tempo: SeaweedFS (S3 gateway) in one pod. Demo credentials, for a demo only.
# The image is the multi-arch build of the upstream SeaweedFS release that the operator e2e tests use
# (the upstream MinIO community image on quay.io is no longer public).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs
  namespace: genai-demo
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: genai-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: quay.io/redhat-distributed-tracing-qe/seaweedfs:4.48@sha256:e78cbe6b4fef844dbd7dc9daa55bea593e1e20b08ff6934998e1ac6a7486e8e2
          # One process with master, volume server, filer and S3 gateway. -bucket pre-creates the bucket
          # Tempo uses; -ip avoids depending on network interface auto-detection.
          args:
            - mini
            - -dir=/data
            - -bucket=tempo
            - -ip=127.0.0.1
          env:
            - name: AWS_ACCESS_KEY_ID
              value: tempo
            - name: AWS_SECRET_ACCESS_KEY
              value: supersecret
          ports:
            - containerPort: 8333
              name: s3
          # Ready once the volume server registered with the master and the S3 gateway answers for the bucket.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  curl -sf http://localhost:9333/dir/status | grep -q '"DataNodes"' &&
                  curl -sf -o /dev/null --aws-sigv4 "aws:amz:us-east-1:s3"
                  --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY"
                  http://localhost:8333/tempo/
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: seaweedfs
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: genai-demo
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
---
apiVersion: v1
kind: Secret
metadata:
  name: tempo-storage
  namespace: genai-demo
type: Opaque
stringData:
  endpoint: http://seaweedfs.genai-demo.svc.cluster.local:8333
  bucket: tempo
  access_key_id: tempo
  access_key_secret: supersecret
